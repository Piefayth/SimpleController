# On a pushed tag: each addon in the matrix packaged as its own zip by the
# BigWigsMods packager and attached to a GitHub Release (the workflow's own token),
# and uploaded to every site whose token is set and whose project ID is in the .toc.
# A site whose secret is empty is skipped by the packager without failing the job.
# The packager (v2.7.0) skips WoWInterface for Forever builds (RELEASING.md).
name: Release

on:
  push:
    tags:
      - "*"

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release
    strategy:
      matrix:
        addon:
          - SimpleController_Spin
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }} # the workflow's own token, nothing to add
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the packager's changelog and version come from the history and tags
      - uses: BigWigsMods/packager@v2
        with:
          args: -m ${{ matrix.addon }}/.pkgmeta
