# On a pushed tag naming an addon, that addon packaged as its own zip by the
# BigWigsMods packager and attached to a GitHub Release (the workflow's own token),
# and uploaded to every site whose token is set and whose project ID is in its .toc.
#   spin-v1.2.0     Simple Controller: Spin
#   core-v0.1.0     Simple Controller, the core Bars and Wheels require
#   bars-v0.1.0     Simple Controller: Bars
#   wheels-v0.1.0   Simple Controller: Wheels
# A tag with "alpha" or "beta" in it is a prerelease (bars-v0.1.0-beta). A site whose
# secret is empty, or whose ID is not in the .toc, is skipped without failing the job.
# The packager (v2.7.0) skips WoWInterface for Forever builds (RELEASING.md).
name: Release

on:
  push:
    tags:
      - "*"

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release
    strategy:
      matrix:
        include:
          - addon: SimpleController_Spin
            tag: spin-
          - addon: SimpleController
            tag: core-
          - addon: SimpleController_Bars
            tag: bars-
            bundle: Simple-Controller-Bars
            title: "Simple Controller: Bars"
          - addon: SimpleController_Wheels
            tag: wheels-
            bundle: Simple-Controller-Wheels
            title: "Simple Controller: Wheels"
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }} # the workflow's own token, nothing to add
    steps:
      - uses: actions/checkout@v4
        if: startsWith(github.ref_name, matrix.tag)
        with:
          fetch-depth: 0 # the packager's changelog and version come from the history and tags
      - uses: BigWigsMods/packager@v2
        if: startsWith(github.ref_name, matrix.tag)
        with:
          args: -m ${{ matrix.addon }}/.pkgmeta
      # GitHub only, for whoever installs by hand: the addon with the core it needs in
      # one zip, named to be the one to click, and said first in the release notes. The
      # sites, and release.json (which addon managers read), keep the addon's own zip.
      # The core is packaged from the same commit, with no upload (-d).
      - uses: BigWigsMods/packager@v2
        if: startsWith(github.ref_name, matrix.tag) && matrix.bundle
        with:
          args: -d -r ${{ github.workspace }}/.release-core -m SimpleController/.pkgmeta # an absolute path: the packager refuses a relative one
      - name: The download-this zip
        if: startsWith(github.ref_name, matrix.tag) && matrix.bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          NAME: DOWNLOAD-THIS-${{ matrix.bundle }}-${{ github.ref_name }}.zip
          TITLE: ${{ matrix.title }}
        run: |
          set -euo pipefail
          mkdir bundle
          for zip in .release/*.zip .release-core/*.zip; do unzip -q "$zip" -d bundle; done
          (cd bundle && zip -qr "../$NAME" .)
          gh release upload "$TAG" "$NAME"
          notes=$(gh release view "$TAG" --json body --jq .body)
          {
            echo "## ⬇️ Download **\`$NAME\`**"
            echo
            echo "Unzip it into \`World of Warcraft/_forever_/Interface/AddOns\`. It has $TITLE and the Simple Controller core it needs."
            echo
            echo "---"
            echo
            echo "$notes"
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
